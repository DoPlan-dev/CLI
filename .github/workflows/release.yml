name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g., 1.2.0)'
        required: true
        type: string

jobs:
  build:
    name: Build Binaries
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false
      
      - name: Clear cache and temp directories
        run: |
          rm -rf ~/.cache ~/.go/pkg/mod/cache /tmp/build-cache || true
          echo "Cache cleared"
      
      - name: Verify tar integrity
        run: |
          tar --version
          echo "Tar version check passed"
      
      - name: Debug disk space
        run: |
          df -h
          echo "Disk space check completed"
      
      - name: Check permissions
        run: |
          ls -la ${{ github.workspace }}
          echo "Permissions check completed"
      
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: go.sum
      
      - name: Extract version
        id: version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "Version: $VERSION"
      
      - name: Download dependencies
        run: |
          go mod download
          go mod verify
      
      - name: Build
        run: |
          set -e
          BINARY_NAME=doplan
          if [ "${{ matrix.goos }}" = "windows" ]; then
            BINARY_NAME=doplan.exe
          fi
          echo "Building for ${{ matrix.goos }}/${{ matrix.goarch }}..."
          echo "Go version: $(go version)"
          MODULE_PATH=$(go list -m)
          VERSION_SYMBOL="$MODULE_PATH/internal/version.Version"
          echo "Module path: $MODULE_PATH"
          echo "Injecting version via: $VERSION_SYMBOL"
          GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -v -ldflags "-X ${VERSION_SYMBOL}=${{ steps.version.outputs.version }}" -o $BINARY_NAME ./cmd/doplan
          ls -lh $BINARY_NAME || echo "Binary not created!"
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
      
      - name: Create archive
        run: |
          set -e
          VERSION=${{ steps.version.outputs.version }}
          
          # Debug: Verify binary exists before archiving
          echo "Checking binary existence..."
          if [ "${{ matrix.goos }}" = "windows" ]; then
            if [ ! -f doplan.exe ]; then
              echo "ERROR: doplan.exe not found!"
              ls -la
              exit 1
            fi
            echo "Creating zip archive for Windows..."
            zip -v doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.zip doplan.exe || {
              echo "ERROR: zip failed with exit code $?"
              exit 1
            }
            sha256sum doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.zip > doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.zip.sha256
            echo "Windows archive created successfully"
          else
            if [ ! -f doplan ]; then
              echo "ERROR: doplan binary not found!"
              ls -la
              exit 1
            fi
            echo "Creating tar.gz archive for ${{ matrix.goos }}..."
            # Use verbose output to see what tar is processing
            tar -czvf doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz doplan || {
              echo "ERROR: tar failed with exit code $?"
              echo "Debug info:"
              echo "Binary exists: $(test -f doplan && echo 'YES' || echo 'NO')"
              echo "Binary size: $(ls -lh doplan 2>/dev/null || echo 'N/A')"
              echo "Working directory: $(pwd)"
              echo "Files in directory:"
              ls -la
              exit 1
            }
            sha256sum doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz > doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz.sha256
            echo "Archive created successfully: $(ls -lh doplan-$VERSION-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz)"
          fi
      
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: doplan-${{ matrix.goos }}-${{ matrix.goarch }}
          path: doplan-*-${{ matrix.goos }}-${{ matrix.goarch }}*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
          registry-url: 'https://registry.npmjs.org/'
          always-auth: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Extract version
        id: get_version
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION=${GITHUB_REF#refs/tags/v}
          fi
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Update package.json version
        run: |
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          TARGET_VERSION="${{ steps.get_version.outputs.version }}"
          if [ "$CURRENT_VERSION" != "$TARGET_VERSION" ]; then
            npm version $TARGET_VERSION --no-git-tag-version
          else
            echo "Version already set to $TARGET_VERSION, skipping update"
          fi

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          continue-on-error: false
      
      - name: Verify downloaded artifacts
        run: |
          echo "Verifying downloaded artifacts..."
          if [ ! -d dist ]; then
            echo "ERROR: dist directory not found!"
            exit 1
          fi
          echo "Artifacts directory contents:"
          find dist -type f -name "*.tar.gz" -o -name "*.zip" -o -name "*.sha256" | sort
          echo "Artifact verification completed"

      - name: Generate release notes
        id: release_notes
        run: |
          if [ -f CHANGELOG.md ]; then
            # Extract changelog section for this version
            VERSION="${{ steps.get_version.outputs.version }}"
            awk "/^## \\[$VERSION\\]/,/^## /" CHANGELOG.md | head -n -1 > release_notes.txt || true
          else
            echo "No CHANGELOG.md found" > release_notes.txt
          fi

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: Release ${{ steps.get_version.outputs.tag }}
          body_path: release_notes.txt
          files: dist/**/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check npm token
        id: check_npm_token
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "has_token=true" >> $GITHUB_OUTPUT
          else
            echo "has_token=false" >> $GITHUB_OUTPUT
          fi

      - name: Verify npm authentication
        if: steps.check_npm_token.outputs.has_token == 'true'
        run: |
          npm whoami
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish to npm
        if: steps.check_npm_token.outputs.has_token == 'true'
        run: |
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add package.json
          git commit -m "chore: bump version to ${{ steps.get_version.outputs.version }}" || exit 0
          git push || exit 0
