name: Task Branch CI

on:
  push:
    branches:
      - 'task/*'

jobs:
  task:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/task/')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
      - name: Run tests
        run: go test ./...
  feature:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/feature/')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
      - name: Run tests
        run: go test ./...
      - name: Build CLI
        run: go build ./cmd/doplan
  hotfix:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/heads/hotfix/')
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v3
      - name: Run tests
        run: go test ./...
      - name: Build CLI
        run: go build ./cmd/doplan
      - name: Publish Image
        run: |
          echo "TODO: add publish step"

  summary:
    runs-on: ubuntu-latest
    needs:
      - task
      - feature
      - hotfix
    steps:
      - name: Display required checks
        run: |
          echo 'Required checks per branch:'
          echo 'task/ -> lint, test'
          echo 'feature/ -> lint, test'
          echo 'hotfix/ -> lint, test, build'

