name: Branch Protection

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  enforce-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check PR requirements
        run: |
          echo "Checking PR requirements..."
          echo "✓ PR title should follow conventional commits"
          echo "✓ PR should have description"
          echo "✓ All CI checks must pass"
          echo "✓ At least one approval required for main/develop"
