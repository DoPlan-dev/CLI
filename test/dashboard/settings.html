	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.0.0/dist/js/tabler.min.js"></script>
	<script>
		document.querySelectorAll('.tab-button').forEach(btn => {
			btn.addEventListener('click', function() {
				document.querySelectorAll('.tab-button').forEach(b => b.classList.remove('active'));
				this.classList.add('active');
			});
		});
		
		async function loadAgents() {
			try {
				// Agent files are in subdirectories: .do/core/agents/{category}/{agent}.md
				const agentPaths = [
					'leadership/project_orchestrator.md',
					'product/product_manager.md',
					'engineering/engineering_lead.md',
					'engineering/system_architect.md',
					'engineering/frontend_lead.md',
					'engineering/backend_lead.md',
					'engineering/devops_engineer.md',
					'engineering/security_lead.md',
					'engineering/performance_engineer.md',
					'design/design_manager.md',
					'design/ui_ux_designer.md',
					'documentation/documentation_lead.md',
					'documentation/documentation_writer.md',
					'quality/qa_manager.md',
					'quality/qa_engineer.md',
					'release/release_manager.md',
					'release/release_captain.md',
					'release/growth_coach.md'
				];
				
				let html = '';
				let loadedCount = 0;
				
				for (const path of agentPaths) {
					try {
						// Try multiple possible paths (prioritize data/agents for easier access)
						const paths = [
							'data/agents/' + path,
							'../.do/core/agents/' + path,
							'../.cursor/agents/' + path.split('/')[0] + '/' + path.split('/')[1]
						];
						
						let loaded = false;
						for (const fetchPath of paths) {
							try {
								const response = await fetch(fetchPath);
								if (response.ok) {
									const content = await response.text();
									// Extract name from first heading (# Title)
									const nameMatch = content.match(/^#\s+(.+?)(?:\n|$)/m);
									// Extract role from "## Role" section
									const roleMatch = content.match(/^##\s+Role\s*\n(.+?)(?:\n|$)/m) || content.match(/Role[:\s]+(.+?)(?:\n|$)/i);
									
									const fileName = path.split('/').pop().replace('.md', '').replace(/_/g, ' ');
									const name = nameMatch ? nameMatch[1].trim() : fileName.split(' ').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
									const role = roleMatch ? roleMatch[1].trim() : 'Agent';
									
									html += '<tr><td>' + name + '</td><td>' + role + '</td><td><span class="badge bg-success">Active</span></td></tr>';
									loadedCount++;
									loaded = true;
									break;
								}
							} catch (e) {
								// Try next path
								continue;
							}
						}
					} catch (e) {
						// Skip this agent
						continue;
					}
				}
				
				if (loadedCount === 0) {
					console.warn('No agents loaded. Tried paths:', agentPaths);
					document.getElementById('agentsList').innerHTML = '<tr><td colspan="3" class="text-muted">No agents data available yet. Make sure agent files exist in dashboard/data/agents/</td></tr>';
				} else {
					console.log('Loaded', loadedCount, 'agents successfully');
					document.getElementById('agentsList').innerHTML = html;
				}
			} catch (e) {
				console.error('Error loading agents:', e);
				document.getElementById('agentsList').innerHTML = '<tr><td colspan="3" class="text-muted">Error loading agents. Check console for details.</td></tr>';
			}
		}
		loadAgents();
	</script>
